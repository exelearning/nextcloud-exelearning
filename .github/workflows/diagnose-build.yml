name: Prepare focused webpack hotfix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-hotfix:
    name: Generate, verify, and commit dependency fix
    if: github.repository == 'exelearning/nextcloud-exelearning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/declare-terser-webpack-plugin
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Declare the missing webpack minimizer dependency
        run: npm install --save-dev "terser-webpack-plugin@^5.5.0"

      - name: Verify frontend build
        run: npm run build

      - name: Commit generated dependency files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): declare terser webpack plugin dependency"
          git push origin HEAD:hotfix/declare-terser-webpack-plugin
