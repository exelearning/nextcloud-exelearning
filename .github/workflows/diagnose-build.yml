name: Diagnose frontend build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate and verify focused webpack hotfix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the missing webpack minimizer dependency
        run: npm install --save-dev "terser-webpack-plugin@^5.5.0"

      - name: Run frontend build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload generated hotfix files and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpack-hotfix
          path: |
            package.json
            package-lock.json
            build.log
          if-no-files-found: error

      - name: Propagate build result
        if: steps.build.outputs.status != '0'
        run: exit 1
