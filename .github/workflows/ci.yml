name: CI

# Frontend (Biome + ESLint + vue-tsc + Vitest) and a sparse PHP × Nextcloud
# matrix that boots a real Nextcloud server, installs the app and verifies
# it enables. Runs on every push to main, every pull request, and on demand.
#
# Matrix is intentionally sparse (5 stable + 1 experimental cells, not the
# full Cartesian product). All cells use sqlite — this app has no DB
# migrations or schema of its own, so a real-DB sweep would only re-test
# Nextcloud core's own DB layer. `SMillerDev/nextcloud-actions/setup-nextcloud`
# also doesn't accept credentials for pgsql/mysql, so non-sqlite cells
# would need service containers + a wrapper just to install Nextcloud.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-records:
    name: Architecture records (identifiers, metadata, cross-references)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate architecture records
        run: node tools/architecture-records.mts check

      - name: Test the record tooling itself
        run: node tools/architecture-records.mts list  # smoke: the shared script parses and runs

      - name: Print the record index
        run: node tools/architecture-records.mts list >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Biome + ESLint + vue-tsc + Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the vendored external-media artifact
        # eXeLearning core is canonical (exelearning/exelearning ADR-2199-12): this repo holds the BYTES and
        # verifies them against the manifest core published, rather than a copy of the
        # logic that could drift. --build-hash makes it a PROVENANCE check and not merely
        # an integrity one: without it a locally rebuilt-and-resigned copy would pass.
        #
        # The expected hash is PINNED HERE, deliberately, and not read from the vendored
        # manifest. A hash taken from the copy under test cannot say anything about that
        # copy: file, digest and buildHash can all be rewritten together, and a check that
        # trusted them would pass a consistent forgery. Bump it in the same commit that
        # re-vendors the artifact.
        run: node src/embed/exe_external_media/verify.mjs src/embed/exe_external_media --build-hash "43c776daa551fd770b6dade520629362e5a8ca8745e4245c359447c4689b34d6"

      # Biome lints .ts/.js under src/. Vue single-file components stay
      # with ESLint (better Vue support); see biome.json for scope.
      - name: Biome lint
        run: npm run lint:biome

      - name: ESLint
        run: npm run lint

      - name: TypeScript check (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

  validate-info-xml:
    name: Validate appinfo/info.xml against the appstore schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `xmllint` ships in the libxml2-utils package, which the
      # GitHub-hosted ubuntu-latest images no longer preinstall.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Validate info.xml
        run: |
          set -euo pipefail
          # Download the schema outside the working tree so the repo stays
          # clean (otherwise `appinfo/info.xsd` shows up as untracked).
          curl -fsSL -o "${RUNNER_TEMP}/info.xsd" \
            https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema "${RUNNER_TEMP}/info.xsd" appinfo/info.xml

  backend:
    name: ${{ matrix.nextcloud }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NC 31 — first version of the supported range
          - { php: '8.2', nextcloud: 'stable31', database: 'sqlite' }
          - { php: '8.4', nextcloud: 'stable31', database: 'sqlite' }
          # NC 32 — middle of the range
          - { php: '8.3', nextcloud: 'stable32', database: 'sqlite' }
          # NC 33 — current latest, the version that exposed the
          # @nextcloud/files v3→v4 scope mismatch this matrix exists to
          # prevent regressing on.
          - { php: '8.2', nextcloud: 'stable33', database: 'sqlite' }
          - { php: '8.4', nextcloud: 'stable33', database: 'sqlite' }
          # PHP 8.5 preview — informational, allowed to fail.
          - { php: '8.5', nextcloud: 'stable33', database: 'sqlite', experimental: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, gd, zip, intl, mbstring, ctype, curl, dom, fileinfo, simplexml, xml, xmlreader, xmlwriter
          tools: composer:v2, cs2pr
          coverage: none

      # composer.lock is not committed (see .gitignore), so resolve from
      # composer.json. `nextcloud/coding-standard` provides php-cs-fixer
      # with the Nextcloud preset that .php-cs-fixer.dist.php loads.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          set -euo pipefail
          ! find appinfo lib tests -name '*.php' -print0 \
            | xargs -0 -n1 -I{} php -l '{}' \
            | grep -v '^No syntax errors detected'

      - name: PHP CS Fixer (Nextcloud coding standard)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration tests/phpunit.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Boot the matched Nextcloud branch with the matched database. The
      # action checks out nextcloud/server at `version` (stable31, etc.),
      # configures the requested DB and runs `occ maintenance:install`.
      - name: Set up Nextcloud server (${{ matrix.nextcloud }} / ${{ matrix.database }})
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@main
        with:
          version: ${{ matrix.nextcloud }}
          database-type: ${{ matrix.database }}
          cron: false

      # Symlink THIS repo (which already has the built js/) into the
      # Nextcloud apps directory and `occ app:enable exelearning`.
      - name: Install eXeLearning app into the running Nextcloud
        uses: SMillerDev/nextcloud-actions/setup-nextcloud-app@main
        with:
          app: exelearning
          check-code: false

      # Smoke: the app must enable cleanly under each Nextcloud major.
      # `setup-nextcloud-app` only stages the app; we still need to call
      # `occ app:enable` ourselves. A failure here catches missing OCP
      # classes, broken DI, info.xml dependencies that no longer apply,
      # and migrations that fail under the matrix DB. The matching
      # browser-level regression (Files API v3↔v4 scope mismatch) is
      # caught upstream of this step by `npm run build` against
      # `@nextcloud/files@^4`.
      - name: Smoke test — app enables cleanly
        working-directory: ../server
        run: |
          set -euo pipefail
          php occ app:enable exelearning
          php occ app:list --output=json \
            | jq -e '.enabled.exelearning != null'
          # SwController serves the worker as a static asset; sanity-check
          # that the file actually got staged into the app tree.
          test -f apps/exelearning/src/sw/exelearning-sw.js \
            || test -f custom_apps/exelearning/src/sw/exelearning-sw.js

  preview-e2e:
    name: Editor-preview API E2E (real Nextcloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd, zip, intl, mbstring, ctype, curl, dom, fileinfo, simplexml, xml, xmlreader, xmlwriter
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Nextcloud server
        uses: SMillerDev/nextcloud-actions/setup-nextcloud@main
        with:
          version: stable33
          database-type: sqlite
          cron: false

      - name: Install eXeLearning app into the running Nextcloud
        uses: SMillerDev/nextcloud-actions/setup-nextcloud-app@main
        with:
          app: exelearning
          check-code: false

      # Serve the installed Nextcloud over HTTP (the built-in PHP server routes
      # everything through the front controller, `/index.php/...`), enable the
      # app, create the owner + a second user, then drive the real management
      # and serving routes end to end. Cookie/session auth is used on purpose so
      # the CSRF middleware is genuinely exercised.
      - name: Preview API end-to-end against the running Nextcloud
        working-directory: ../server
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          php occ app:enable exelearning
          php occ config:system:set trusted_domains 1 --value=127.0.0.1
          # Treat the origin as plain HTTP end-to-end so the login session cookie
          # and the SameSite cookies are NOT marked Secure — curl over http never
          # sends a Secure cookie back, which silently breaks the login POST's
          # own CSRF/strict-cookie check and leaves every request unauthenticated.
          # Use a webroot WITHOUT /index.php so cookies get Path=/ (routing still
          # goes through the /index.php front controller under php -S).
          php occ config:system:set overwrite.cli.url --value="http://127.0.0.1:8080"
          php occ config:system:set overwriteprotocol --value=http
          php occ config:system:delete forcessl 2>/dev/null || true
          php occ config:system:delete overwritehost 2>/dev/null || true

          export OC_PASS='Preview-e2e-owner-1!'
          php occ user:add --password-from-env previewe2e1
          export OC_PASS='Preview-e2e-other-2!'
          php occ user:add --password-from-env previewe2e2

          # The built-in server's document root is the Nextcloud tree, so the
          # top-level status.php is served directly (routed app URLs go through
          # /index.php/... instead).
          php -S 127.0.0.1:8080 >"${RUNNER_TEMP}/nc-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/nc-server.pid"
          ready=
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/status.php" | grep -q '"installed":true'; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = "1" ] || { echo "Nextcloud did not come up"; curl -s "http://127.0.0.1:8080/status.php" || true; cat "${RUNNER_TEMP}/nc-server.log"; exit 1; }

          EXE_E2E_BASE="http://127.0.0.1:8080/index.php" \
          EXE_E2E_USER1=previewe2e1 EXE_E2E_PASS1='Preview-e2e-owner-1!' \
          EXE_E2E_USER2=previewe2e2 EXE_E2E_PASS2='Preview-e2e-other-2!' \
            bash "${WORKSPACE}/tests/e2e/preview-api-e2e.sh" \
            || { echo '--- nextcloud.log (tail) ---'; tail -n 80 data/nextcloud.log 2>/dev/null || true; exit 1; }

          kill "$(cat "${RUNNER_TEMP}/nc-server.pid")" 2>/dev/null || true
