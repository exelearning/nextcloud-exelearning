  - "src/main.ts"
  - "src/editor/editor-frame.ts"
  - "src/editor/editor-page.ts"
  - "src/elpx/elpx-loader.ts"
  - "src/elpx/service-worker-client.ts"
  - "src/files/actions.ts"
  - "src/files/new-menu.ts"
  - "src/sw/**/*"
  - "src/types/**/*"
  - "src/view/**/*"
  - "src/viewer/**/*"
